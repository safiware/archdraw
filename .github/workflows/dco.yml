# Every commit in a pull request carries a Developer Certificate of Origin sign-off (git commit -s). See CONTRIBUTING.md.
name: dco
on: pull_request
permissions:
  contents: read
jobs:
  sign-off:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            # Dependabot's own commits: a bot cannot certify the DCO (the DCO app exempts bots the same way)
            if [ "$(git show -s --format=%ae "$c")" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then continue; fi
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no Signed-off-by line (use git commit -s)"
              fail=1
            fi
          done
          exit $fail
