# A version tag (v0.1.0) builds the release: signed and notarized macOS packages (Apple Silicon and Intel), Linux
# AppImage and deb, the updater's latest*.yml files, SHA256SUMS and build-provenance attestations, all attached to a
# DRAFT GitHub release. A maintainer reads it and presses Publish; nothing is public before that.
# Run by hand (Actions > release > Run workflow), it is a rehearsal: the same builds and launch checks, the macOS app
# with an ad hoc signature instead of the Developer ID one (a tester opens it once from System Settings > Privacy &
# Security > Open Anyway on macOS 15 and later, or right-click > Open on macOS 13 and 14), every package
# uploaded as a run artifact for testers, and no release and no signing secrets.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: ${{ github.event_name == 'push' }} # a rehearsal reports every platform
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # the signing secrets live in the release environment, behind a required reviewer; a rehearsal never opens it
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: the tag matches the app's version
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./app/package.json').version")" = "$GITHUB_REF_NAME"
      - name: engine
        working-directory: engine
        run: npm ci && npm run build
      - name: app dependencies
        working-directory: app
        run: npm ci && cd ui && bun install --frozen-lockfile
      - name: unit tests
        working-directory: app
        run: npx vitest run && cd ui && npx vitest run
      - name: build
        working-directory: app
        run: npm run build:all
      - name: package (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # One step for a release and a rehearsal, so a rehearsal proves the path a release takes. A tag with the Apple
        # secrets in the release environment: Developer ID signed and notarized. Otherwise (a rehearsal has no
        # environment, and a release before the Apple account is in place): an ad hoc signature. The secrets then
        # arrive as empty variables, and electron-builder reads an empty CSC_LINK as a certificate path, so they are
        # unset first. mac-signing.txt carries which one to the release job, which removes it before the checksums.
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            npx electron-builder --mac --arm64 --x64 --publish never -c.mac.notarize=true
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            echo developer-id > release/mac-signing.txt
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
            if [ "$GITHUB_EVENT_NAME" = push ]; then echo "::warning::No Apple signing secrets in the release environment: the macOS app is signed ad hoc and not notarized"; fi
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --x64 --publish never -c.mac.identity=-
            echo ad-hoc > release/mac-signing.txt
          fi
      - name: launch check (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: ARCHDRAW_SMOKE=1 ARCHDRAW_NO_UPDATE=1 perl -e 'alarm 120; exec @ARGV' release/mac-arm64/archdraw.app/Contents/MacOS/archdraw
      - name: package (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: npx electron-builder --linux --publish never
      - name: launch check (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: ARCHDRAW_SMOKE=1 ARCHDRAW_NO_UPDATE=1 timeout 120 xvfb-run -a release/linux-unpacked/archdraw --no-sandbox --user-data-dir="$RUNNER_TEMP/archdraw-smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'push' && 'release' || 'rehearsal' }}-${{ runner.os }}
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.blockmap
            app/release/latest*.yml
            app/release/mac-signing.txt
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: release notes
        # an ad hoc signed Mac build gets its opening steps at the top of the notes; the marker never ships
        run: |
          : > notes.md
          if [ "$(cat dist/mac-signing.txt 2>/dev/null)" = "ad-hoc" ]; then
            cat > notes.md <<'NOTES'
          > **On a Mac, the first time:** this build is not yet notarized by Apple, so macOS asks you to confirm it once.
          > Open archdraw from Applications, then go to **System Settings → Privacy & Security** and press **Open Anyway**
          > (on macOS 13 and 14, right-click the app and choose **Open**). Step by step:
          > [Opening archdraw on a Mac](https://github.com/safiware/archdraw/blob/main/docs/install-mac.md).
          > This build tells you when a new version is out; install it by downloading it again.

          NOTES
          fi
          rm -f dist/mac-signing.txt
      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "archdraw ${GITHUB_REF_NAME#v}" --generate-notes --notes-file notes.md
